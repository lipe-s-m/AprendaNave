<header>
  <app-subheader />
</header>

<div class="criar-curso-container">
  <main class="criar-curso-content">
    <div class="header-section">
      <h1>Criar Curso</h1>
      <p class="subtitle">Preencha as informações para criar seu curso</p>
    </div>

    <form [formGroup]="formCriarCurso" (ngSubmit)="handleSubmit()" class="curso-form">
      <div class="divisoria">
        <div class="inputs bloco-1">
          <div class="form-group">
            <label for="nome">Nome do Curso *</label>
            <app-input placeholder="Digite o nome do curso" inputName="nome" inputSize="large" inputType="text" formControlName="nome" />
            <span class="error-message" *ngIf="isFieldInvalid('nome')">
              {{ getErrorMessage('nome') }}
            </span>
          </div>

          <div class="form-group logo-upload-group">
            <label for="logo">Imagem de capa *</label>
            <input
              #logoInput
              id="logo"
              class="visually-hidden"
              type="file"
              accept="image/jpeg,image/png,image/webp"
              (change)="onLogoSelecionada($event)"
            />
            <div class="logo-upload">
              <img *ngIf="logoPreview" [src]="logoPreview" alt="Prévia da capa do curso" />
              <span *ngIf="!logoPreview" class="material-icons" aria-hidden="true">add_photo_alternate</span>
              <div class="logo-upload-copy">
                <strong>{{ logoFile ? logoFile.name : 'Escolha a capa do curso' }}</strong>
                <span>JPG, PNG ou WebP · até 5 MB</span>
              </div>
              <label class="upload-trigger" for="logo">{{ logoFile ? 'Trocar' : 'Enviar imagem' }}</label>
            </div>
            <button *ngIf="logoFile" class="remove-logo" type="button" (click)="removerLogo(); logoInput.value = ''">
              Remover imagem
            </button>
          </div>

          <div class="form-group">
            <label for="autor">Autor</label>
            <app-input placeholder="Autor do curso" inputName="autor" inputSize="large" inputType="text" formControlName="autor" [inputDisabled]="true" />
          </div>
        </div>
        <div class="bloco-2">

          <div class="form-group">
            <label for="descricao">Descrição *</label>
            <app-input inputName="descricao" inputSize="large" inputType="textarea" formControlName="descricao" placeholder="Descreva o conteúdo e objetivos do curso..." [rows]=6></app-input>
            <span class="error-message" *ngIf="isFieldInvalid('descricao')">
              {{ getErrorMessage('descricao') }}
            </span>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <app-button buttonText="Criar Curso" buttonSize="large" buttonLevel="primary" buttonTheme="dark" buttonType="submit" [buttonDisabled]="formCriarCurso.invalid || !logoFile || isLoading()" />
        <app-button buttonText="Cancelar" buttonSize="large" buttonLevel="secondary" buttonTheme="dark" buttonType="button" (click)="goToMeusCursos()" />
      </div>
    </form>
  </main>
</div>

<div class="loading" *ngIf="isLoading()">
  <app-loader></app-loader>
</div>
