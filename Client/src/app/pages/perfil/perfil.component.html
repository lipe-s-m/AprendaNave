<div class="background">
  <header>
    <app-subheader />
  </header>

  <div class="page-container perfil-container">
    <!-- Faixa de resumo -->
    <section class="perfil-resumo panel">
      <img
        class="avatar"
        [src]="userSignal()?.fotoPerfil || 'assets/avatar-default.svg'"
        [alt]="'Foto de perfil de ' + (userSignal()?.nome || 'usuário')"
      />
      <div class="resumo-info">
        <h1 class="page-title">Olá, {{ userSignal()?.nome }}!</h1>
        <p class="page-subtitle" *ngIf="userSignal()?.bio">Bio: {{ userSignal()?.bio }}</p>
        <div class="resumo-stats">
          <span class="stat">
            <span class="material-icons" aria-hidden="true">toll</span>
            {{ userSignal()?.pontos ?? 0 }} Navecoins
          </span>
          <span class="stat">
            <span class="material-icons" aria-hidden="true">emoji_events</span>
            {{ conquistasDesbloqueadas() }} de {{ conquistas().length }} conquistas
          </span>
        </div>
      </div>
      <app-button
        (click)="openEditModal()"
        type="button"
        buttonText="Editar"
        buttonSize="small"
      ></app-button>
    </section>

    <!-- Conquistas -->
    <section class="conquistas">
      <h2 class="page-title">Conquistas</h2>

      <div class="loading" *ngIf="isLoadingConquistas()"><app-loader /></div>

      <div class="conquistas-grid" *ngIf="!isLoadingConquistas() && conquistas().length > 0">
        <article
          class="card"
          *ngFor="let c of conquistas()"
          [class.bloqueada]="!c.desbloqueada"
        >
          <div class="logo">
            <img
              [src]="c.desbloqueada ? 'assets/flag-green.svg' : 'assets/flag-red.svg'"
              [alt]="(c.desbloqueada ? 'Conquista desbloqueada: ' : 'Conquista bloqueada: ') + c.nome"
            />
          </div>
          <div class="info-text">
            <h3>{{ c.nome }}</h3>
            <p>{{ c.descricao }}</p>
            <div class="card-footer">
              <app-status-badge
                [label]="c.desbloqueada ? 'Desbloqueada' : 'Bloqueada'"
                [status]="c.desbloqueada ? 'success' : 'neutral'"
              />
              <span class="recompensa" *ngIf="c.desbloqueada">+{{ c.pontos }} pts</span>
            </div>
          </div>
        </article>
      </div>

      <app-empty-state
        *ngIf="!isLoadingConquistas() && conquistas().length === 0"
        title="Nenhuma conquista disponível"
        description="Em breve novas conquistas chegam por aqui."
        icon="flag"
      />
    </section>
  </div>

  <!-- Modal Editar Perfil -->
  <app-modal-editar-perfil *ngIf="showModal()" (close)="closeEditModal()">
  </app-modal-editar-perfil>
</div>
