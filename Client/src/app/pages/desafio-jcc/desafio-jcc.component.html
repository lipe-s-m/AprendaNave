<header><app-subheader></app-subheader></header>

<main class="container">
  <section class="content">
    <div class="content-info">
      <h1>Ranking histórico — Desafio JCC</h1>
      <p>Este é o placar das edições anteriores do Desafio JCC. As partidas desta modalidade foram encerradas para preservar os resultados.</p>
      <app-button buttonText="Ver ranking JCC + AFS" buttonTheme="dark" (click)="irParaDesafioAfs()"></app-button>
    </div>
    <div class="ranking">
      <h2>Ranking dos desafiantes</h2>
      <ol>
        <li *ngFor="let participante of ranking" [class.first]="ranking[0] === participante" [class.second]="ranking[1] === participante" [class.third]="ranking[2] === participante" [class.podio]="ranking[0] === participante || ranking[1] === participante || ranking[2] === participante">
          <span class="nome">{{ participante.nomeAluno }}</span><span class="pontos">{{ participante.pontuacaoAluno }} pontos</span>
        </li>
      </ol>
    </div>
  </section>
</main>
