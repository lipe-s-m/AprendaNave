<app-subheader infoMode="meus-cursos" />

<div class="page-container">
  <main>
    <!-- Cabeçalho: título + CTA único -->
    <header class="page-header">
      <div>
        <h1 class="page-title">Meus cursos</h1>
        <p class="page-subtitle">Crie, gerencie e publique suas trilhas de aprendizado.</p>
      </div>
      <div class="page-header-actions">
        <app-button buttonText="Criar curso" buttonType="button" (click)="router.navigate(['/curso/criar'])"></app-button>
      </div>
    </header>

    <!-- Grade de cards -->
    <div class="courses-grid" *ngIf="!isLoading() && cursos().length > 0">
      <article class="course-card" *ngFor="let curso of cursos()">
        <span class="badge-top">
          <app-status-badge [label]="getStatusBadge(curso.statusAprovacao).text" [status]="getStatusBadge(curso.statusAprovacao).status" />
        </span>

        <div class="course-icon">
          <img [src]="curso.logo" [alt]="curso.nome" (error)="onLogoError($event)" />
        </div>

        <div class="card-content">
          <div class="title-section">
            <h3>{{ curso.nome }}</h3>
            <p class="description" *ngIf="curso.descricao">{{ curso.descricao }}</p>
          </div>

          <div class="card-footer">
            <button class="btn-gerenciar" type="button" (click)="goToGerenciar(curso)">
              <span class="material-icons" aria-hidden="true">settings</span>
              Gerenciar curso
            </button>

            <div class="card-actions">
              <button
                class="action-btn danger"
                type="button"
                (click)="confirmarExcluir(curso)"
                [attr.aria-label]="'Excluir curso ' + curso.nome"
                title="Excluir curso"
              >
                <span class="material-icons" aria-hidden="true">delete</span>
              </button>
            </div>
          </div>
        </div>
      </article>
    </div>

    <!-- Empty state -->
    <app-empty-state
      *ngIf="!isLoading() && cursos().length === 0 && !error()"
      title="Nenhum curso criado"
      description="Você ainda não criou nenhum curso. Comece criando o seu primeiro!"
      icon="school"
      actionText="Criar curso"
      (action)="router.navigate(['/curso/criar'])"
    />

    <!-- Erro com tentar novamente -->
    <div class="error-state" *ngIf="error()">
      <p>{{ error() }}</p>
      <button class="retry-button" type="button" (click)="loadMeusCursos()">Tentar Novamente</button>
    </div>
  </main>
</div>

<div class="loading" *ngIf="isLoading()">
  <app-loader></app-loader>
</div>

<app-confirm-modal
  [isOpen]="modalExcluir().aberto"
  title="Excluir Curso"
  [message]="modalExcluir().mensagem"
  variant="danger"
  (confirm)="executarExclusao()"
  (cancel)="fecharModalExcluir()"
/>
