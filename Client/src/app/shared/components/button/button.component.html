<button [ngClass]="[buttonTheme, buttonLevel, buttonSize]" [style.background-color]="buttonBackgroundColor && buttonBackgroundColor" [style.color]="buttonTextColor && buttonTextColor" [disabled]="buttonDisabled">
  <img class="play" *ngIf="buttonText?.toLocaleLowerCase() === 'iniciar'" src="assets/play-button.svg" alt="">
  {{buttonText}}
</button>
