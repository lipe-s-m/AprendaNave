<label class="input-label" *ngIf="label" [for]="inputName">{{ label }}</label>

<input
  *ngIf="inputType !== 'textarea'"
  [type]="inputType"
  [name]="inputName"
  [id]="inputName"
  [placeholder]="placeholder"
  [ngClass]="[inputSize, inputLevel, errorMessage ? 'has-error' : '']"
  [value]="value"
  [disabled]="inputDisabled"
  [attr.aria-invalid]="errorMessage ? true : null"
  [attr.aria-describedby]="(hint || errorMessage) ? inputName + '-help' : null"
  (input)="onInputChange($event)"
  (blur)="onTouched()"
/>

<textarea
  *ngIf="inputType === 'textarea'"
  [name]="inputName"
  [id]="inputName"
  [placeholder]="placeholder"
  [ngClass]="[inputSize, inputLevel, errorMessage ? 'has-error' : '']"
  [rows]="rows"
  [disabled]="inputDisabled"
  [attr.aria-invalid]="errorMessage ? true : null"
  [attr.aria-describedby]="(hint || errorMessage) ? inputName + '-help' : null"
  (input)="onInputChange($event)"
  [value]="value"
  (blur)="onTouched()"
></textarea>

<p class="input-hint" *ngIf="hint && !errorMessage" [id]="inputName + '-help'">{{ hint }}</p>
<p class="input-error" *ngIf="errorMessage" [id]="inputName + '-help'">{{ errorMessage }}</p>
