<div class="modal-backdrop" *ngIf="isOpen" (click)="fechar()">
  <div
    class="modal-content"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-title-' + isOpen"
    (click)="$event.stopPropagation()"
  >
    <h3 [id]="'confirm-title-' + isOpen">{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="modal-actions">
      <button class="btn-cancel" type="button" (click)="fechar()">{{ cancelText }}</button>
      <button
        class="btn-confirm"
        [class]="variant"
        type="button"
        (click)="confirm.emit()"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
